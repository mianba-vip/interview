# 旧服务器 Docker Web 的过渡入口（18080 -> 容器 80）。
# EdgeOne 仍回源此端口时，经 HTTPS 转发至新前端机。
map $http_upgrade $mianba_entry_connection {
    default upgrade;
    '' close;
}
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name mianba.vip www.mianba.vip;
    client_max_body_size 50m;
    location / {
        proxy_pass https://106.14.143.151;
        # 使用新机默认 TLS 站点；仍校验证书链和 mianba.vip 域名。
        proxy_ssl_server_name off;
        proxy_ssl_name mianba.vip;
        proxy_ssl_verify on;
        proxy_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;
        proxy_ssl_verify_depth 3;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $mianba_entry_connection;
        proxy_buffering off;
        proxy_cache off;
        gzip off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}
