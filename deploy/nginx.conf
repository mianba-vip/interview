# gzip 只对静态资源开（html/js/css/svg 等）；/api 内部再显式关闭，SSE 流不缓冲不压缩
gzip on;
gzip_vary on;
gzip_min_length 1k;
gzip_comp_level 5;
gzip_types text/plain text/css text/javascript application/javascript application/json image/svg+xml;

map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}

# IP 地址和未知域名访问（80）直接断开连接
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    return 444;
}

# IP 地址和未知域名访问（443）拒绝 TLS 握手（nginx >= 1.19.4，无需证书文件）
server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    ssl_reject_handshake on;
}

# ---------------------------------------------------------------------------
# HTTP 入口：直连 http://mianba.vip 也能用（过渡期兼容 EdgeOne 回源 / 旧客户端）。
# EdgeOne 彻底下线、DNS 切到源站后，如需强制 HTTPS，
# 把本 server 整块替换为：  return 308 https://$host$request_uri;
# ---------------------------------------------------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name mianba.vip;

    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 50m;

    # API、SSE 和 WebSocket
    location /api/ {
        proxy_pass http://backend:23333;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        # TLS 已在 nginx 终结，直接告诉后端真实协议（不再透传 EdgeOne 的头）
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_buffering off;
        proxy_cache off;
        gzip off;
        add_header X-Accel-Buffering no;

        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
    }

    # 后端健康检查
    location = /actuator/health {
        proxy_pass http://backend:23333/healthz;
        proxy_set_header Host $host;
        access_log off;
    }

    # Web SPA
    location /app/ {
        try_files $uri $uri/ /app/index.html;
    }

    location = /app {
        return 301 /app/;
    }

    # 官网
    location / {
        try_files $uri $uri/ /index.html;
    }
}

# ---------------------------------------------------------------------------
# HTTPS 主入口（EdgeOne 下线后由 nginx 自己终结 TLS）
# 证书由宿主机 web-image/certs/ 挂载进来（见 docker-compose.prod.yml web.volumes），
# 由 deploy-local.sh / deploy-web.sh 之外的证书步骤维护（acme.sh DNS-01 或云厂商免费证书）。
# ---------------------------------------------------------------------------
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name mianba.vip;

    ssl_certificate     /etc/nginx/certs/mianba.vip.pem;
    ssl_certificate_key /etc/nginx/certs/mianba.vip.key;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # HSTS：不带 includeSubDomains / preload，避免误伤尚未规划的子域名
    add_header Strict-Transport-Security "max-age=31536000" always;

    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 50m;

    # API、SSE 和 WebSocket
    location /api/ {
        proxy_pass http://backend:23333;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_buffering off;
        proxy_cache off;
        gzip off;
        add_header X-Accel-Buffering no;

        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
    }

    # 后端健康检查
    location = /actuator/health {
        proxy_pass http://backend:23333/healthz;
        proxy_set_header Host $host;
        access_log off;
    }

    # Web SPA
    location /app/ {
        try_files $uri $uri/ /app/index.html;
    }

    location = /app {
        return 301 /app/;
    }

    # 官网
    location / {
        try_files $uri $uri/ /index.html;
    }
}
