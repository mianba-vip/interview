# 旧服务器宿主机 /etc/nginx/conf.d/mianba.conf。
# EdgeOne/DNS 尚未切换时，旧入口将请求转发至新前端机；新前端直接经 SSH 隧道访问后端。
# 本文件不属于 legacy-web Docker 镜像配置。
map $http_upgrade $mianba_entry_connection {
    default upgrade;
    '' close;
}
server {
    listen 80 default_server;
    server_name mianba.vip www.mianba.vip;
    client_max_body_size 50m;
    location / {
        proxy_pass https://106.14.143.151;
        # 公网携带域名 SNI 会被重置；按 IP 回源，仍校验证书链和下方域名。
        proxy_ssl_server_name off;
        proxy_ssl_name mianba.vip;
        proxy_ssl_verify on;
        proxy_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;
        proxy_ssl_verify_depth 3;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $mianba_entry_connection;
        proxy_buffering off;
        proxy_cache off;
        gzip off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}
server {
    listen 443 ssl default_server;
    server_name mianba.vip www.mianba.vip;
    ssl_certificate /opt/mianba/web-image/certs/mianba.vip.pem;
    ssl_certificate_key /opt/mianba/web-image/certs/mianba.vip.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 50m;
    location / {
        proxy_pass https://106.14.143.151;
        proxy_ssl_server_name off;
        proxy_ssl_name mianba.vip;
        proxy_ssl_verify on;
        proxy_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;
        proxy_ssl_verify_depth 3;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $mianba_entry_connection;
        proxy_buffering off;
        proxy_cache off;
        gzip off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}
