name: Build mobile APK

on:
  workflow_dispatch:
  push:
    branches: [main]

# 与桌面端流水线同款约定：同一时间只跑一个，新 push 取消旧 run
concurrency:
  group: mobile-build
  cancel-in-progress: true

permissions:
  contents: write

env:
  # APK 内置后端地址（正式域名，EdgeOne / 源站切换域名不变）
  VITE_API_BASE: https://mianba.vip

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      # 不依赖第三方 action：优先用 runner 自带 cmdline-tools，缺了就现场装（runner 在海外可直连 dl.google）
      - name: Install Android SDK packages
        shell: bash
        run: |
          set -euo pipefail
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          SM="$SDK/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -f "$SM" ]; then
            mkdir -p "$SDK/cmdline-tools"
            curl -fsSL -o /tmp/cmdline-tools.zip https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
            unzip -q /tmp/cmdline-tools.zip -d "$SDK/cmdline-tools"
            rm -rf "$SDK/cmdline-tools/latest"
            mv "$SDK/cmdline-tools/cmdline-tools" "$SDK/cmdline-tools/latest"
            SM="$SDK/cmdline-tools/latest/bin/sdkmanager"
          fi
          yes | "$SM" --licenses > /dev/null || true
          "$SM" --sdk_root="$SDK" "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Install mobile deps (npm ci)
        shell: bash
        run: cd mobile && npm ci

      - name: Build mobile web (VITE_API_BASE)
        shell: bash
        run: cd mobile && npm run build

      - name: Verify API base baked into bundle
        shell: bash
        run: |
          if ! grep -rq "mianba.vip" mobile/dist/assets/; then
            echo "::error::VITE_API_BASE 没有烘进 web 产物（装到手机会 failed to fetch）"
            exit 1
          fi
          echo "ok: API base baked"

      - name: Capacitor sync android
        shell: bash
        run: cd mobile && npx cap sync android

      - name: Gradle assembleDebug
        shell: bash
        run: |
          cd mobile/android
          sed -i "s|distributionUrl=.*|distributionUrl=https://services.gradle.org/distributions/gradle-8.14.3-all.zip|" gradle/wrapper/gradle-wrapper.properties
          sh gradlew assembleDebug --no-daemon

      - name: Prepare artifact
        shell: bash
        run: cp mobile/android/app/build/outputs/apk/debug/app-debug.apk mianba-debug.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: mobile-apk
          path: mianba-debug.apk
          if-no-files-found: error

  release:
    name: Attach APK to GitHub release
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # 与桌面端共用同一版本号 → APK 附加到同一个 Release（vX.Y.Z）
      - name: Read version
        id: version
        shell: bash
        run: |
          VERSION="$(node -p "require('./interview-desktop/package.json').version")"
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid version: $VERSION" >&2
            exit 1
          fi
          printf 'version=%s\n' "$VERSION" >> "$GITHUB_OUTPUT"

      - name: Download APK
        uses: actions/download-artifact@v4
        with:
          name: mobile-apk
          path: release-assets

      - name: Upload APK to release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          TAG="v${{ steps.version.outputs.version }}"
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --target "${{ github.sha }}" --title "面霸 $TAG" --generate-notes
          gh release upload "$TAG" release-assets/mianba-debug.apk --clobber
