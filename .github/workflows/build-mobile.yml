name: Build mobile APK

on:
  workflow_dispatch:
  push:
    branches: [main]

# 与桌面端流水线同款约定：同一时间只跑一个，新 push 取消旧 run
concurrency:
  group: mobile-build
  cancel-in-progress: true

permissions:
  contents: write

env:
  # APK 内置后端地址（正式域名，EdgeOne / 源站切换域名不变）
  VITE_API_BASE: https://mianba.vip

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        shell: bash
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Build web + sync + assemble debug APK
        shell: bash
        run: |
          npm --prefix mobile ci
          npm --prefix mobile run build
          cd mobile && npx cap sync android
          cd android && sh gradlew assembleDebug --no-daemon

      - name: Prepare artifact
        shell: bash
        run: cp mobile/android/app/build/outputs/apk/debug/app-debug.apk mianba-debug.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: mobile-apk
          path: mianba-debug.apk
          if-no-files-found: error

  release:
    name: Attach APK to GitHub release
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # 与桌面端共用同一版本号 → APK 附加到同一个 Release（vX.Y.Z）
      - name: Read version
        id: version
        shell: bash
        run: |
          VERSION="$(node -p "require('./interview-desktop/package.json').version")"
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid version: $VERSION" >&2
            exit 1
          fi
          printf 'version=%s\n' "$VERSION" >> "$GITHUB_OUTPUT"

      - name: Download APK
        uses: actions/download-artifact@v4
        with:
          name: mobile-apk
          path: release-assets

      - name: Upload APK to release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          TAG="v${{ steps.version.outputs.version }}"
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --target "${{ github.sha }}" --title "面霸 $TAG" --generate-notes
          gh release upload "$TAG" release-assets/mianba-debug.apk --clobber
