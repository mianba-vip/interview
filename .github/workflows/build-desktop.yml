name: Build desktop packages

on:
  workflow_dispatch:
  push:
    branches: [main]

# 发布串行执行，保留排队的 push，防止两个 run 分配到同一版本或发布中途被取消。
concurrency:
  group: desktop-build
  cancel-in-progress: false
  queue: max

permissions:
  contents: write

env:
  # 后端部署在服务器：桌面端只打包「Electron 壳 + 前端 SPA」（云模式）。
  # 前端构建时把 API 地址烘焙为 MIANBA_SERVER，config.json 写入 serverUrl →
  # 应用启动即云模式（不拉本地后端）。仓库需配置同名 Secret。
  MIANBA_SERVER: ${{ secrets.MIANBA_SERVER }}

jobs:
  prepare:
    name: Prepare desktop release version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Checkout source and all version tags
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Test release version and cloud build behavior
        run: |
          npm --prefix interview-desktop run test:release
          npm --prefix interview-desktop run test:credentials

      - name: Prepare version once for all platforms
        id: version
        shell: bash
        run: |
          # main push 自动递增；手动 workflow_dispatch 保持只构建、不递增或发布的语义。
          if [[ "$GITHUB_EVENT_NAME" == push && "$GITHUB_REF" == refs/heads/main ]]; then
            VERSION="$(node interview-desktop/scripts/next-release-version.js)"
          else
            VERSION="$(node -p "require('./interview-desktop/package.json').version")"
          fi
          npm --prefix interview-desktop version "$VERSION" --no-git-tag-version --ignore-scripts --allow-same-version
          printf 'version=%s\n' "$VERSION" >> "$GITHUB_OUTPUT"
          printf '### Desktop version: %s\n' "$VERSION" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload versioned manifests
        uses: actions/upload-artifact@v4
        with:
          name: desktop-release-manifests
          path: |
            interview-desktop/package.json
            interview-desktop/package-lock.json
          if-no-files-found: error

  build:
    name: Build ${{ matrix.label }}
    needs: prepare
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            label: win-x64
            target: win
            artifact: windows-package
          # mac 只用一个 macos-latest（arm64）runner，交叉编译 x64 + arm64 两套包
          - os: macos-latest
            label: mac-x64+arm64
            target: mac
            artifact: macos-package

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Download shared versioned manifests
        uses: actions/download-artifact@v4
        with:
          name: desktop-release-manifests
          path: interview-desktop

      # 前端 SPA 已拆分到独立仓库 mianba-vip/mianba-web（公开）：
      # 匿名克隆到 frontend/ 路径，供桌面打包脚本引用（无需任何凭据）
      - name: Clone web SPA (mianba-web)
        shell: bash
        run: |
          # Checkout 步骤持久化的 GITHUB_TOKEN 认证头只对本仓库有效，
          # 不清掉的话跨仓库克隆会被 403 拒绝
          git config --local --unset-all http.https://github.com/.extraheader || true
          git clone --depth 1 -b main https://github.com/mianba-vip/mianba-web.git frontend

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            interview-desktop/package-lock.json

      - name: Resolve and verify cloud backend
        shell: bash
        run: |
          if [ -z "$MIANBA_SERVER" ]; then
            echo "::error::缺少 MIANBA_SERVER 仓库 Secret（后端服务器地址，云打包用它把前端 API 地址烘焙进安装包）。请在仓库 Settings → Secrets 里配置后重试。"
            exit 1
          fi
          SERVER="$(node interview-desktop/scripts/resolve-cloud-server.js)"
          printf 'MIANBA_SERVER=%s\n' "$SERVER" >> "$GITHUB_ENV"
          # 版本包必须能通过公开入口访问认证服务；禁止把仅回环开放的旧端口烘进安装包。
          curl -fsS --connect-timeout 10 --max-time 20 --retry 2 "$SERVER/api/auth/config" \
            | node -e "let body=''; process.stdin.on('data', x => body += x); process.stdin.on('end', () => { const c=JSON.parse(body); if (typeof c.captchaRequired !== 'boolean' || typeof c.emailVerifyRequired !== 'boolean') process.exit(1); });"

      - name: Install deps and build SPA (cloud)
        shell: bash
        run: |
          npm --prefix frontend ci
          npm --prefix interview-desktop ci
          cd interview-desktop
          node scripts/build-cloud.js

      # ---------------- Windows（云模式：只打包前端） ----------------
      - name: Build Windows package
        if: matrix.target == 'win'
        shell: bash
        run: |
          cd interview-desktop
          npx electron-builder --win --x64 --config electron-builder.cloud.yml --publish never

      # ---------------- macOS：单 runner 交叉编译 x64 + arm64（云模式） ----------------
      - name: Build macOS arm64 package
        if: matrix.target == 'mac'
        shell: bash
        run: |
          cd interview-desktop
          npx electron-builder --mac --arm64 --config electron-builder.cloud.yml --publish never

      - name: Build macOS x64 package
        if: matrix.target == 'mac'
        shell: bash
        run: |
          cd interview-desktop
          npx electron-builder --mac --x64 --config electron-builder.cloud.yml --publish never

      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            interview-desktop/dist-electron-cloud/*.exe
            interview-desktop/dist-electron-cloud/*.dmg
            interview-desktop/dist-electron-cloud/*.zip
            interview-desktop/dist-electron-cloud/*.yml
            interview-desktop/dist-electron-cloud/*.blockmap
          if-no-files-found: error

  release:
    name: Publish GitHub release
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [prepare, build]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download packages
        uses: actions/download-artifact@v4
        with:
          pattern: '*-package'
          merge-multiple: true
          path: release-assets

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
        shell: bash
        run: |
          TAG="v${RELEASE_VERSION}"
          # 安装包的更新清单必须与标签版本相同，避免更新器收到版本不一致的产物。
          shopt -s nullglob
          METADATA=(release-assets/latest*.yml)
          if [ "${#METADATA[@]}" -eq 0 ]; then
            echo 'No updater metadata found' >&2
            exit 1
          fi
          for file in "${METADATA[@]}"; do
            grep -Fxq "version: $RELEASE_VERSION" "$file" || {
              echo "Updater version mismatch: $file (expected $RELEASE_VERSION)" >&2
              exit 1
            }
          done
          # 官网固定下载链接依赖这四个资产，缺少任何平台都不能发布为最新版。
          for asset in mianba-cloud-win-x64.exe mianba-cloud-win-x64.zip mianba-cloud-mac-arm64.dmg mianba-cloud-mac-x64.dmg; do
            test -s "release-assets/$asset" || { echo "Missing download asset: $asset" >&2; exit 1; }
          done
          mapfile -d '' ASSETS < <(find release-assets -maxdepth 1 -type f \
            \( -name '*.exe' -o -name '*.dmg' -o -name '*.zip' -o -name '*.yml' -o -name '*.blockmap' \) \
            -print0)
          if [ "${#ASSETS[@]}" -eq 0 ]; then
            echo "No releasable files found" >&2
            find release-assets -maxdepth 2 -print
            exit 1
          fi
          printf 'Uploading %s\n' "${ASSETS[@]}"
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --draft --target "${{ github.sha }}" --title "面霸 $TAG" --generate-notes
          gh release upload "$TAG" "${ASSETS[@]}" --clobber
          # 全部上传成功后才切换 Latest，下载入口在上传期间仍指向上个完整版本。
          gh release edit "$TAG" --draft=false --latest
