# 后端机 103.236.92.40：PostgreSQL、Redis、MinIO、Spring Boot。
# 前端由 mianba-web/deploy/deploy-web.sh 发布到 106.14.143.151。
# PostgreSQL、Redis、MinIO 只允许从服务器本机或 Compose 内网访问。
# 管理端连接数据库请使用 SSH 隧道，不要把基础设施端口直接暴露到公网。
services:
  postgres:
    image: pgvector/pgvector:pg16@sha256:ccc6e83d6e35e931dc7c5def2022729d5a6c370318d099181995567ff1fb4d6b
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?请在 .env 设置 POSTGRES_PASSWORD}"
      POSTGRES_DB: ${POSTGRES_DB:-interview}
    ports:
      - "${POSTGRES_BIND_ADDRESS:-127.0.0.1}:${POSTGRES_HOST_PORT:-5432}:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-interview}"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine@sha256:ff02b58f971e7d7d156a1267e283fcbbeee91773b6aa36c49dac28ecfe28eadf
    restart: unless-stopped
    command:
      - sh
      - -c
      - exec redis-server --appendonly yes --requirepass "$$REDIS_PASSWORD"
    environment:
      REDIS_PASSWORD: "${REDIS_PASSWORD:?请在 .env 设置 REDIS_PASSWORD}"
    ports:
      - "${REDIS_BIND_ADDRESS:-127.0.0.1}:${REDIS_HOST_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "REDISCLI_AUTH=\"$$REDIS_PASSWORD\" redis-cli ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio@sha256:14cea493d9a34af32f524e538b8346cf79f3321eff8e708c1e2960462bd8936e
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: "${MINIO_ROOT_USER:?请在 .env 设置 MINIO_ROOT_USER}"
      MINIO_ROOT_PASSWORD: "${MINIO_ROOT_PASSWORD:?请在 .env 设置 MINIO_ROOT_PASSWORD}"
    ports:
      - "${MINIO_BIND_ADDRESS:-127.0.0.1}:${MINIO_API_HOST_PORT:-9000}:9000"
      - "${MINIO_BIND_ADDRESS:-127.0.0.1}:${MINIO_CONSOLE_HOST_PORT:-9001}:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 20

  minio-init:
    image: minio/mc@sha256:a7fe349ef4bd8521fb8497f55c6042871b2ae640607cf99d9bede5e9bdf11727
    restart: "no"
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >-
        mc alias set local http://minio:9000 "$${MINIO_ROOT_USER}" "$${MINIO_ROOT_PASSWORD}" &&
        mc mb --ignore-existing "local/$${MINIO_BUCKET}"
    environment:
      MINIO_ROOT_USER: "${MINIO_ROOT_USER:?请在 .env 设置 MINIO_ROOT_USER}"
      MINIO_ROOT_PASSWORD: "${MINIO_ROOT_PASSWORD:?请在 .env 设置 MINIO_ROOT_PASSWORD}"
      MINIO_BUCKET: ${APP_STORAGE_BUCKET:-interview}

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    volumes:
      - backend_files:/app/data/files
    ports:
      # 默认只绑回环：公网入口在前端机 nginx，经 SSH 隧道打本机 127.0.0.1:23333；
      # 不要改回 0.0.0.0（明文 API 与 BYOK key 会直接暴露公网）。
      - "${BACKEND_BIND_ADDRESS:-127.0.0.1}:${BACKEND_HOST_PORT:-23333}:23333"
    environment:
      APP_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-interview}
      APP_DATASOURCE_USERNAME: ${POSTGRES_USER:-postgres}
      APP_DATASOURCE_PASSWORD: "${POSTGRES_PASSWORD:?请在 .env 设置 POSTGRES_PASSWORD}"
      APP_DATASOURCE_DRIVER: org.postgresql.Driver
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: "6379"
      SPRING_DATA_REDIS_PASSWORD: "${REDIS_PASSWORD:?请在 .env 设置 REDIS_PASSWORD}"
      APP_STORAGE_ENDPOINT: http://minio:9000
      APP_STORAGE_MODE: ${APP_STORAGE_MODE:-minio}
      APP_STORAGE_LOCAL_DIR: /app/data/files
      APP_STORAGE_ACCESS_KEY: "${MINIO_ROOT_USER:?请在 .env 设置 MINIO_ROOT_USER}"
      APP_STORAGE_SECRET_KEY: "${MINIO_ROOT_PASSWORD:?请在 .env 设置 MINIO_ROOT_PASSWORD}"
      APP_STORAGE_BUCKET: ${APP_STORAGE_BUCKET:-interview}
      APP_STORAGE_REGION: ${APP_STORAGE_REGION:-us-east-1}
      APP_JWT_SECRET: ${APP_JWT_SECRET:?请在 .env 设置 APP_JWT_SECRET}
      # kg-forge 服务间认证：与下方 kg-forge 服务用同一变量，保证两侧一致
      APP_FORGE_SECRET: ${APP_FORGE_SECRET:-change-me-forge-secret}
      APP_SWAGGER_ENABLED: ${APP_SWAGGER_ENABLED:-false}
      MODEL_NAME: ${MODEL_NAME:-deepseek-chat}
      MAIL_HOST: ${MAIL_HOST:-}
      MAIL_PORT: ${MAIL_PORT:-587}
      MAIL_USERNAME: ${MAIL_USERNAME:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
      MAIL_FROM: ${MAIL_FROM:-}
      MAIL_SSL_ENABLE: ${MAIL_SSL_ENABLE:-false}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy

  # kg-forge：知识图谱锻造炉 sidecar（Python/LangGraph）。仅 Compose 内网，
  # 不发布端口；backend 经 http://kg-forge:8100 调用，双方共用 APP_FORGE_SECRET。
  # Agent 只有提案权；批准后的校验与落库由 backend（ForgeService）完成。
  kg-forge:
    build:
      context: ./kg-forge
    restart: unless-stopped
    environment:
      FORGE_SECRET: ${APP_FORGE_SECRET:-change-me-forge-secret}
      FORGE_DB_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      # FORGE_API_KEY：可选服务端兜底 LLM key（请求未带 BYOK 时使用），默认不配
    depends_on:
      postgres:
        condition: service_healthy

  # 旧机过渡入口或同机回退，构建上下文为部署机已有的 web-image/。
  # 当前过渡配置为 deploy/nginx-container-entry.conf；同机回退配置为 deploy/nginx.conf。
  # 前后端发布脚本不再上传此静态树，Dockerfile 与上下文由运维按需准备。
  web:
    # 仅供回退到旧同机部署：docker compose --profile legacy-web ...
    profiles: [legacy-web]
    build:
      context: ./web-image
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      # EdgeOne 下线后 nginx 直接对公网：80（HTTP/健康检查）+ 443（TLS，证书见下方挂载）
      # 机房若做 NAT，把公网 80/443 映射到这两个宿主机端口即可
      - "${WEB_HTTP_PORT:-80}:80"
      - "${WEB_HTTPS_PORT:-443}:443"
    volumes:
      # TLS 证书（mianba.vip.pem / mianba.vip.key），不入镜像；nginx 启动时必须存在
      - ./web-image/certs:/etc/nginx/certs:ro
    depends_on:
      - backend

volumes:
  backend_files:
  pg_data:
  redis_data:
  minio_data:
