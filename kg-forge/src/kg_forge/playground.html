<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>kg-forge 锻造测试台</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⚒️</text></svg>">
<style>
/* ============================================================
   kg-forge 锻造测试台
   材质语言:铸铁暖黑 + 炉火橙。层级色阶按「金属温度」递进:
   L1 淬火蓝 → L2 青铜 → L3 黄铜 → L4 炽橙 → L5 赤红。
   炉火只烧一处:动画仅用于活动阶段的脉冲。
   ============================================================ */
:root {
  --bg: #141210;
  --panel: #1c1916;
  --panel-2: #211d19;
  --line: #332d26;
  --line-soft: #29241e;
  --ink: #d9d2c6;
  --ink-dim: #968c7e;
  --ink-faint: #6b6357;
  --ember: #e8632a;
  --ember-deep: #b44718;
  --ember-soft: rgba(232, 99, 42, .14);
  --brass: #d1a24a;
  --ok: #8fae6f;
  --bad: #c05548;
  --l1: #7d95ad;
  --l2: #a5a06b;
  --l3: #d1a24a;
  --l4: #e0762f;
  --l5: #cf4a3a;
  --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }
body {
  background:
    radial-gradient(1200px 500px at 70% -10%, rgba(232, 99, 42, .05), transparent 60%),
    var(--bg);
  color: var(--ink);
  font: 14px/1.65 -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Segoe UI", sans-serif;
  min-height: 100vh;
}
button { font: inherit; color: inherit; cursor: pointer; }
input, textarea, select { font: inherit; color: var(--ink); }
:focus-visible { outline: 2px solid var(--ember); outline-offset: 2px; border-radius: 3px; }

/* ---------- 顶栏 ---------- */
.topbar {
  display: flex; align-items: center; justify-content: space-between;
  padding: 14px 22px; border-bottom: 1px solid var(--line);
  background: rgba(20, 18, 16, .92); position: sticky; top: 0; z-index: 5;
  backdrop-filter: blur(6px);
}
.brand { display: flex; align-items: center; gap: 12px; }
.brand-mark {
  width: 36px; height: 36px; display: grid; place-items: center;
  background: linear-gradient(160deg, #2a241e, #1c1916);
  border: 1px solid var(--line); border-radius: 8px;
  font-size: 18px; box-shadow: inset 0 1px 0 rgba(255, 255, 255, .04);
}
.brand-text { line-height: 1.25; }
.brand-text strong { font-size: 16px; letter-spacing: .02em; display: block; }
.brand-text span { color: var(--ink-dim); font-size: 12px; }
.conn { display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--ink-dim); }
.conn-dot { width: 9px; height: 9px; border-radius: 50%; background: var(--ink-faint); }
.conn.ok .conn-dot { background: var(--ok); box-shadow: 0 0 6px rgba(143, 174, 111, .6); }
.conn.bad .conn-dot { background: var(--bad); }
.conn.warn .conn-dot { background: var(--brass); }
.demo-badge {
  display: none; margin-left: 10px; padding: 2px 10px; font-size: 12px;
  border: 1px dashed var(--brass); border-radius: 999px; color: var(--brass);
}
body.demo .demo-badge { display: inline-block; }

/* ---------- 布局 ---------- */
.layout { display: grid; grid-template-columns: 330px 1fr; gap: 18px; max-width: 1280px; margin: 18px auto; padding: 0 18px; align-items: start; }
@media (max-width: 960px) { .layout { grid-template-columns: 1fr; } }

/* ---------- 左侧控制轨 ---------- */
.rail { display: flex; flex-direction: column; gap: 14px; position: sticky; top: 76px; }
@media (max-width: 960px) { .rail { position: static; } }
.card {
  background: var(--panel); border: 1px solid var(--line-soft);
  border-radius: 8px; padding: 14px 16px;
}
.card h3 {
  margin: 0 0 10px; font-size: 13px; font-weight: 600; color: var(--ink-dim);
  display: flex; align-items: center; gap: 8px;
}
.card h3::before { content: ""; width: 3px; height: 14px; background: var(--ember-deep); border-radius: 2px; }
.field { margin-bottom: 10px; }
.field:last-child { margin-bottom: 0; }
.field label { display: block; font-size: 12px; color: var(--ink-dim); margin-bottom: 4px; }
.field input[type="text"], .field input[type="password"], .field input[type="number"],
.field textarea, .field select {
  width: 100%; background: var(--bg); border: 1px solid var(--line);
  border-radius: 5px; padding: 7px 10px; font-size: 13px;
}
.field textarea { resize: vertical; min-height: 54px; }
.field input:focus, .field textarea:focus, .field select:focus { border-color: var(--ember-deep); outline: none; }
.hint { font-size: 12px; color: var(--ink-faint); margin-top: 4px; }
.range-row { display: flex; align-items: center; gap: 10px; }
.range-row input[type="range"] { flex: 1; accent-color: var(--ember); }
.range-row input[type="number"] { width: 74px; }
.btn {
  border: 1px solid var(--line); background: var(--panel-2); border-radius: 6px;
  padding: 8px 14px; font-size: 13px; transition: background .15s, border-color .15s;
}
.btn:hover { border-color: var(--ink-faint); }
.btn:disabled { opacity: .45; cursor: not-allowed; }
.btn-primary {
  width: 100%; background: linear-gradient(180deg, var(--ember), var(--ember-deep));
  border: 1px solid var(--ember-deep); color: #fff7ef; font-weight: 600;
  padding: 10px; font-size: 14px; letter-spacing: .06em;
}
.btn-primary:hover:not(:disabled) { filter: brightness(1.08); }
.btn-ok { background: rgba(143, 174, 111, .14); border-color: rgba(143, 174, 111, .5); color: var(--ok); }
.btn-ok:hover:not(:disabled) { background: rgba(143, 174, 111, .24); }
.btn-bad { background: transparent; border-color: rgba(192, 85, 72, .45); color: var(--bad); }
.btn-bad:hover:not(:disabled) { background: rgba(192, 85, 72, .12); }
.btn-ghost { background: transparent; }

/* 历史列表 */
.hist { list-style: none; margin: 0; padding: 0; max-height: 240px; overflow: auto; }
.hist li {
  display: flex; align-items: center; gap: 8px; padding: 7px 8px;
  border-radius: 5px; font-size: 13px; cursor: pointer;
}
.hist li:hover { background: var(--panel-2); }
.hist .h-topic { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.hist .h-time { color: var(--ink-faint); font-size: 11px; }
.hist .h-del { border: 0; background: none; color: var(--ink-faint); padding: 0 2px; font-size: 13px; }
.hist .h-del:hover { color: var(--bad); }
.hist-empty { color: var(--ink-faint); font-size: 12px; margin: 4px 0; }

/* ---------- 右侧观察台 ---------- */
.stage-view { display: flex; flex-direction: column; gap: 16px; min-height: 60vh; }

.run-meta {
  display: flex; align-items: center; gap: 12px; flex-wrap: wrap;
  font-size: 13px; color: var(--ink-dim);
}
.run-meta .rid { font-family: var(--mono); font-size: 12px; color: var(--ink-faint); }
.chip {
  display: inline-block; padding: 2px 10px; border-radius: 999px;
  font-size: 12px; border: 1px solid var(--line);
}
.chip.run { color: var(--ember); border-color: rgba(232, 99, 42, .5); background: var(--ember-soft); }
.chip.review { color: var(--brass); border-color: rgba(209, 162, 74, .5); background: rgba(209, 162, 74, .1); }
.chip.ok { color: var(--ok); border-color: rgba(143, 174, 111, .5); background: rgba(143, 174, 111, .1); }
.chip.bad { color: var(--bad); border-color: rgba(192, 85, 72, .5); background: rgba(192, 85, 72, .1); }

/* 流水线阶段器 */
.pipe-wrap { background: var(--panel); border: 1px solid var(--line-soft); border-radius: 8px; padding: 18px 20px 14px; }
.pipe { list-style: none; display: flex; margin: 0; padding: 0; }
.p-node { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 7px; position: relative; }
.p-node::before {
  content: ""; position: absolute; top: 6px; left: calc(-50% + 9px); right: calc(50% + 9px);
  height: 2px; background: var(--line);
}
.p-node:first-child::before { display: none; }
.p-node.done::before, .p-node.active::before { background: var(--ember-deep); }
.p-dot {
  width: 14px; height: 14px; border-radius: 50%;
  background: var(--panel-2); border: 2px solid var(--line);
  position: relative; z-index: 1;
}
.p-node.done .p-dot { background: var(--ember-deep); border-color: var(--ember-deep); }
.p-node.active .p-dot {
  background: var(--ember); border-color: var(--ember);
  animation: emberPulse 1.6s ease-in-out infinite;
}
.p-label { font-size: 12px; color: var(--ink-faint); }
.p-node.done .p-label, .p-node.active .p-label { color: var(--ink); }
.p-node.active .p-label { color: var(--ember); }
.pipe.dead .p-dot { background: var(--panel-2); border-color: var(--line); animation: none; }
@keyframes emberPulse {
  0%, 100% { box-shadow: 0 0 0 4px rgba(232, 99, 42, .28); }
  50% { box-shadow: 0 0 0 9px rgba(232, 99, 42, .07); }
}

/* 空态引导 */
.intro { background: var(--panel); border: 1px solid var(--line-soft); border-radius: 8px; padding: 30px 28px; }
.intro h2 { margin: 0 0 6px; font-size: 19px; font-weight: 700; }
.intro p { color: var(--ink-dim); margin: 0 0 14px; max-width: 62ch; }
.intro ol { margin: 0; padding-left: 0; list-style: none; counter-reset: step; }
.intro ol li {
  counter-increment: step; padding: 10px 0 10px 40px; position: relative;
  border-top: 1px solid var(--line-soft); color: var(--ink-dim); max-width: 62ch;
}
.intro ol li::before {
  content: counter(step, cjk-ideographic); position: absolute; left: 2px; top: 10px;
  width: 24px; height: 24px; display: grid; place-items: center;
  border: 1px solid var(--line); border-radius: 50%; font-size: 12px; color: var(--ember);
}
.intro b { color: var(--ink); font-weight: 600; }

/* 覆盖矩阵 */
.matrix-card { background: var(--panel); border: 1px solid var(--line-soft); border-radius: 8px; padding: 14px 16px; }
.matrix-card h3 { margin: 0 0 10px; font-size: 13px; color: var(--ink-dim); font-weight: 600; }
.matrix { width: 100%; border-collapse: collapse; font-size: 13px; }
.matrix th, .matrix td { padding: 7px 10px; text-align: center; border-bottom: 1px solid var(--line-soft); }
.matrix th { color: var(--ink-dim); font-weight: 500; font-size: 12px; }
.matrix th:first-child, .matrix td:first-child { text-align: left; color: var(--ink); }
.matrix td:first-child { font-weight: 600; }
.matrix .cell { border-radius: 4px; display: inline-block; min-width: 30px; padding: 1px 6px; }
.matrix .zero { color: var(--ink-faint); }
.matrix tr:last-child td { border-bottom: 0; }
.matrix tfoot td { border-top: 1px solid var(--line); color: var(--ink-dim); }
.dup-note { margin-top: 8px; font-size: 12px; color: var(--ink-faint); }
.dup-note b { color: var(--ink-dim); font-weight: 600; }

/* 筛选与操作 */
.review-bar { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.layer-filters { display: flex; gap: 6px; flex-wrap: wrap; }
.lf {
  border: 1px solid var(--line); background: transparent; border-radius: 999px;
  padding: 3px 12px; font-size: 12px; color: var(--ink-dim);
}
.lf.on { color: var(--ink); border-color: var(--ink-faint); background: var(--panel-2); }
.lf .n { font-family: var(--mono); font-size: 11px; margin-left: 4px; color: var(--ink-faint); }
.topic-sel { background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 5px 10px; font-size: 13px; max-width: 180px; }
.review-actions { margin-left: auto; display: flex; gap: 10px; align-items: center; }
.count-note { font-size: 12px; color: var(--ink-faint); }

/* 提案卡片 */
.groups { display: flex; flex-direction: column; gap: 12px; }
.topic-group { background: var(--panel); border: 1px solid var(--line-soft); border-radius: 8px; overflow: hidden; }
.tg-head {
  display: flex; align-items: center; gap: 10px; padding: 10px 16px;
  background: var(--panel-2); cursor: pointer; user-select: none; font-size: 13px;
}
.tg-head b { font-size: 14px; }
.tg-head .cnt { color: var(--ink-faint); font-size: 12px; }
.tg-head .arrow { margin-left: auto; color: var(--ink-faint); transition: transform .2s; }
.topic-group.collapsed .arrow { transform: rotate(-90deg); }
.topic-group.collapsed .cards { display: none; }
.cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(330px, 1fr)); gap: 1px; background: var(--line-soft); }
.prop {
  background: var(--panel); padding: 13px 16px; display: flex; flex-direction: column; gap: 7px;
}
.prop-head { display: flex; align-items: flex-start; gap: 9px; }
.layer-tag {
  flex: none; font-size: 11px; padding: 2px 8px; border-radius: 4px; margin-top: 2px;
  font-weight: 600; letter-spacing: .03em;
}
.layer-tag.l1 { color: var(--l1); background: rgba(125, 149, 173, .13); border: 1px solid rgba(125, 149, 173, .35); }
.layer-tag.l2 { color: var(--l2); background: rgba(165, 160, 107, .13); border: 1px solid rgba(165, 160, 107, .35); }
.layer-tag.l3 { color: var(--l3); background: rgba(209, 162, 74, .13); border: 1px solid rgba(209, 162, 74, .35); }
.layer-tag.l4 { color: var(--l4); background: rgba(224, 118, 47, .13); border: 1px solid rgba(224, 118, 47, .35); }
.layer-tag.l5 { color: var(--l5); background: rgba(207, 74, 58, .13); border: 1px solid rgba(207, 74, 58, .35); }
.prop h4 { margin: 0; font-size: 14.5px; font-weight: 650; line-height: 1.45; }
.prop .desc { margin: 0; color: var(--ink-dim); font-size: 13px; }
.subs { display: flex; flex-wrap: wrap; gap: 5px; margin: 2px 0 0; padding: 0; list-style: none; }
.subs li {
  font-size: 11.5px; color: var(--ink-faint); border: 1px solid var(--line-soft);
  background: var(--bg); border-radius: 4px; padding: 1px 8px;
}

/* 终态与提示 */
.banner { border-radius: 8px; padding: 16px 20px; border: 1px solid; font-size: 14px; }
.banner.ok { border-color: rgba(143, 174, 111, .45); background: rgba(143, 174, 111, .09); }
.banner.bad { border-color: rgba(192, 85, 72, .45); background: rgba(192, 85, 72, .09); }
.banner.mute { border-color: var(--line); background: var(--panel); color: var(--ink-dim); }
.banner b { font-size: 15px; }
.banner .sub { display: block; margin-top: 4px; color: var(--ink-dim); font-size: 13px; }
.alert {
  border: 1px solid rgba(192, 85, 72, .5); background: rgba(192, 85, 72, .1);
  border-radius: 6px; padding: 9px 14px; font-size: 13px; color: var(--bad);
}
.err-text { font-family: var(--mono); font-size: 12px; color: var(--ink-dim); word-break: break-all; }
details.raw { border: 1px solid var(--line-soft); border-radius: 8px; background: var(--panel); }
details.raw summary { padding: 9px 16px; cursor: pointer; font-size: 12px; color: var(--ink-faint); }
details.raw pre {
  margin: 0; padding: 4px 16px 14px; overflow: auto; max-height: 340px;
  font-family: var(--mono); font-size: 11.5px; color: var(--ink-dim);
}
.forging-note { color: var(--ink-dim); font-size: 13px; display: flex; align-items: center; gap: 10px; }
.spinner {
  width: 14px; height: 14px; border-radius: 50%; flex: none;
  border: 2px solid var(--line); border-top-color: var(--ember);
  animation: spin 1s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; }
}
</style>
</head>
<body>

<header class="topbar">
  <div class="brand">
    <span class="brand-mark" aria-hidden="true">⚒️</span>
    <div class="brand-text"><strong>kg-forge</strong><span>知识图谱锻造测试台</span></div>
  </div>
  <div class="conn" id="conn">
    <span class="conn-dot" id="connDot"></span><span id="connText">检测 sidecar…</span>
    <span class="demo-badge" id="demoBadge">演示数据 · 未连接 sidecar</span>
  </div>
</header>

<main class="layout">
  <!-- ============ 左:控制轨 ============ -->
  <aside class="rail">
    <section class="card">
      <h3>连接</h3>
      <div class="field">
        <label for="secret">X-Forge-Secret(与 FORGE_SECRET 一致)</label>
        <input type="password" id="secret" placeholder="change-me-forge-secret" autocomplete="off">
        <div class="hint"><button class="btn btn-ghost" id="testSecret" style="padding:2px 6px;">测试密钥</button>
          <span id="secretResult"></span></div>
      </div>
    </section>

    <section class="card">
      <h3>LLM(BYOK,选填)</h3>
      <div class="field">
        <label for="llmBase">base_url</label>
        <input type="text" id="llmBase" placeholder="https://api.deepseek.com">
      </div>
      <div class="field">
        <label for="llmKey">api_key</label>
        <input type="password" id="llmKey" placeholder="sk-…" autocomplete="off">
      </div>
      <div class="field">
        <label for="llmModel">model</label>
        <input type="text" id="llmModel" placeholder="deepseek-chat">
      </div>
      <div class="field">
        <label for="llmTemp">temperature</label>
        <input type="number" id="llmTemp" min="0" max="2" step="0.1" value="0.7">
        <div class="hint">全留空则用服务端兜底配置(FORGE_API_KEY)。填过一次点「开始锻造」即保存在本浏览器,下次自动带出。key 只进 sidecar 进程内存,不落 checkpoint。</div>
      </div>
    </section>

    <section class="card">
      <h3>锻造参数</h3>
      <div class="field">
        <label for="topic">学习方向 *</label>
        <textarea id="topic" placeholder="如:JVM 调优,准备秋招"></textarea>
      </div>
      <div class="field">
        <label for="goal">目标(选填)</label>
        <input type="text" id="goal" placeholder="如:秋招大厂后台">
      </div>
      <div class="field">
        <label for="budget">概念总数预算</label>
        <div class="range-row">
          <input type="range" id="budgetRange" min="10" max="120" step="5" value="50">
          <input type="number" id="budget" min="10" max="120" value="50">
        </div>
      </div>
      <div class="field">
        <label for="existing">已有概念名(选填,每行一个,用于去重)</label>
        <textarea id="existing" placeholder="如:分代假说"></textarea>
      </div>
      <button class="btn btn-primary" id="startBtn">开 始 锻 造</button>
    </section>

    <section class="card">
      <h3>历史</h3>
      <ul class="hist" id="hist"></ul>
      <p class="hist-empty" id="histEmpty">还没有锻造记录</p>
    </section>
  </aside>

  <!-- ============ 右:观察台 ============ -->
  <section class="stage-view" id="stageView"></section>
</main>

<script>
"use strict";
/* ================================================================
   状态与工具
   ================================================================ */
const $ = (id) => document.getElementById(id);
const LAYERS = { 1: "概念", 2: "机制", 3: "实现", 4: "权衡", 5: "故障" };
const LAYER_KEYS = [1, 2, 3, 4, 5];
const FINAL = new Set(["approved", "rejected", "failed"]);

const store = {
  get(k, d) { try { const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) { /* 预览环境无 localStorage */ } },
  del(k) { try { localStorage.removeItem(k); } catch (e) {} },
};

const state = {
  secret: store.get("kgf_secret", ""),
  conn: "unknown",          // unknown | ok | bad(不可达) | warn(密钥无效)
  demo: false,              // sidecar 不可达时的界面演示模式
  run: null,                // { id, topic, status, startedAt, endedAt }
  review: null,             // { concepts, report } 最近一次待审核载荷
  lastRaw: null,
  filterLayer: 0,           // 0=全部
  filterTopic: "",          // ""=全部
  collapsed: new Set(),
  confirm: null,            // 两段式确认:'approve'|'reject'|null
  confirmTimer: null,
  pollTimer: null,
  clockTimer: null,
  history: store.get("kgf_history", []),
};

class ApiError extends Error {
  constructor(status, msg) { super(msg); this.status = status; }
}

function esc(s) {
  return String(s ?? "").replace(/[&<>"']/g, (c) =>
    ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}
function fmtElapsed(ms) {
  const s = Math.max(0, Math.floor(ms / 1000));
  return `${String(Math.floor(s / 60)).padStart(2, "0")}:${String(s % 60).padStart(2, "0")}`;
}
function uid() {
  const r = (window.crypto && crypto.randomUUID) ? crypto.randomUUID().replace(/-/g, "") : Date.now() + String(Math.random()).slice(2);
  return "pg-" + r.slice(0, 16);
}

/* ================================================================
   API(真实 / 演示二选一)
   ================================================================ */
async function api(method, path, body) {
  if (state.demo) return demoApi(method, path, body);
  let res;
  try {
    res = await fetch(path, {
      method,
      headers: { "Content-Type": "application/json", "X-Forge-Secret": state.secret || "" },
      body: body ? JSON.stringify(body) : undefined,
    });
  } catch (e) {
    state.conn = "bad"; renderConn();
    throw new ApiError(0, "sidecar 不可达:服务起了吗?(uvicorn kg_forge.api:app)");
  }
  if (res.status === 401) throw new ApiError(401, "密钥无效(401):X-Forge-Secret 与服务端 FORGE_SECRET 不一致");
  if (!res.ok) throw new ApiError(res.status, `HTTP ${res.status}:${(await res.text()).slice(0, 180)}`);
  return res.json();
}

async function demoApi(method, path, body) {
  await new Promise((r) => setTimeout(r, 260));

    demoState.phase = "forging"; demoState.decision = null;
    setTimeout(() => { demoState.phase = "awaiting_review"; }, 1600);   // 模拟起草耗时
    return { run_id: body.run_id, accepted: true };
  }

  }
  return {};

function stageIndex(status) {

    case "forging": case "running": return { active: 1 };
    case "awaiting_review": return { active: 3 };
    case "approved": case "rejected": return { active: 4, allDone: true };
    case "failed": return { active: -1 };
    default: return { active: 0 };

function renderPipe(status) {

  return `<div class="pipe-wrap"><ol class="pipe${dead ? " dead" : ""}">

/* ---------- 覆盖矩阵 ---------- */
function renderMatrix(report) {
  if (!report) return "";
  const topics = Object.keys(report.topic_layer || {});
  let max = 1;
  for (const t of topics) for (const k of LAYER_KEYS) max = Math.max(max, report.topic_layer[t][String(k)] || 0);
  const heat = (n, layer) => {
    if (!n) return `<span class="zero">·</span>`;
    const a = 0.14 + 0.38 * (n / max);
    const rgb = { 1: "125,149,173", 2: "165,160,107", 3: "209,162,74", 4: "224,118,47", 5: "207,74,58" }[layer];
    return `<span class="cell" style="background:rgba(${rgb},${a})">${n}</span>`;
  };
  return `<div class="matrix-card"><h3>覆盖矩阵(主题 × 层级)</h3>
    <table class="matrix">
      <thead><tr><th>主题</th>${LAYER_KEYS.map((l) => `<th>L${l} ${LAYERS[l]}</th>`).join("")}<th>计</th></tr></thead>
      <tbody>
        ${topics.map((t) => {
          const row = report.topic_layer[t] || {};
          const sum = LAYER_KEYS.reduce((a, l) => a + (row[String(l)] || 0), 0);
          return `<tr><td>${esc(t)}</td>${LAYER_KEYS.map((l) => `<td>${heat(row[String(l)] || 0, l)}</td>`).join("")}<td style="color:var(--ink)"><b>${sum}</b></td></tr>`;
        }).join("")}
      </tbody>
      <tfoot><tr><td>去重情况</td><td colspan="5">批内近似重复 <b>${report.dropped_duplicate ?? 0}</b> 条 · 与已有概念重复 <b>${report.dropped_existing ?? 0}</b> 条</td><td><b>${report.total ?? 0}</b></td></tr></tfoot>
    </table></div>`;
}

/* ---------- 提案卡片 + 筛选 + 操作 ---------- */
function visibleConcepts() {
  if (!state.review) return [];
  return state.review.concepts.filter((c) =>
    (state.filterLayer === 0 || c.layer === state.filterLayer) &&
    (!state.filterTopic || c.topic === state.filterTopic));
}
function renderReview() {
  const all = state.review.concepts;
  const layerCounts = {};
  for (const c of all) layerCounts[c.layer] = (layerCounts[c.layer] || 0) + 1;
  const topics = [...new Set(all.map((c) => c.topic))];

  const groups = topics
    .map((t) => ({ topic: t, list: visibleConcepts().filter((c) => c.topic === t) }))
    .filter((g) => g.list.length);

  return `<div>
    <div class="review-bar">
      <div class="layer-filters">
        <button class="lf ${state.filterLayer === 0 ? "on" : ""}" data-l="0">全部<span class="n">${all.length}</span></button>
        ${LAYER_KEYS.map((l) => `<button class="lf ${state.filterLayer === l ? "on" : ""}" data-l="${l}">L${l} ${LAYERS[l]}<span class="n">${layerCounts[l] || 0}</span></button>`).join("")}
      </div>
      <select class="topic-sel" id="topicSel">
        <option value="">全部主题</option>
        ${topics.map((t) => `<option value="${esc(t)}" ${state.filterTopic === t ? "selected" : ""}>${esc(t)}</option>`).join("")}
      </select>
      <div class="review-actions">
        <span class="count-note">${groups.reduce((a, g) => a + g.list.length, 0)} / ${all.length} 条</span>
        <button class="btn btn-bad" id="rejectBtn">${state.confirm === "reject" ? "确认拒绝?" : "拒绝"}</button>
        <button class="btn btn-ok" id="approveBtn">${state.confirm === "approve" ? "确认批准?" : "批准"}</button>
      </div>
    </div>
    <p class="hint" style="margin:8px 2px 0;">「批准/拒绝」走 sidecar 的 finalize 通道;编辑提案后落库是 Java 审核页的能力,此处不涉及。</p>
    <div class="groups" style="margin-top:10px;">
      ${groups.map((g) => `
        <section class="topic-group ${state.collapsed.has(g.topic) ? "collapsed" : ""}" data-topic="${esc(g.topic)}">
          <div class="tg-head"><b>${esc(g.topic)}</b><span class="cnt">${g.list.length} 条</span><span class="arrow">▾</span></div>
          <div class="cards">
            ${g.list.map((c) => `
              <article class="prop">
                <div class="prop-head">
                  <span class="layer-tag l${c.layer}">L${c.layer} ${LAYERS[c.layer] || ""}</span>
                  <h4>${esc(c.name)}</h4>
                </div>
                <p class="desc">${esc(c.description)}</p>
                ${(c.sub_points || []).length ? `<ul class="subs">${c.sub_points.map((s) => `<li>${esc(s)}</li>`).join("")}</ul>` : ""}
              </article>`).join("")}
          </div>
        </section>`).join("") || `<p class="hint" style="padding:10px 2px;">当前筛选下没有提案。</p>`}
    </div>
  </div>`;
}
function bindReviewActions() {
  document.querySelectorAll(".lf").forEach((b) => {
    b.onclick = () => { state.filterLayer = +b.dataset.l; state.confirm = null; renderStage(); };
  });
  const ts = $("topicSel");
  if (ts) ts.onchange = () => { state.filterTopic = ts.value; state.confirm = null; renderStage(); };
  document.querySelectorAll(".tg-head").forEach((h) => {
    h.onclick = () => {
      const g = h.parentElement;
      const t = g.dataset.topic;
      g.classList.toggle("collapsed");
      g.classList.contains("collapsed") ? state.collapsed.add(t) : state.collapsed.delete(t);
    };
  });
  const ap = $("approveBtn"), rj = $("rejectBtn");
  if (ap) ap.onclick = () => twoStep("approve", () => finalize("approved"));
  if (rj) rj.onclick = () => twoStep("reject", () => finalize("rejected"));
}
function twoStep(kind, fn) {
  if (state.confirm === kind) { clearTimeout(state.confirmTimer); state.confirm = null; fn(); return; }
  state.confirm = kind;
  renderStage();
  state.confirmTimer = setTimeout(() => { state.confirm = null; renderStage(); }, 3000);
}

function tickElapsed() {
  const eb = $("elapsed");

   主流程
   ================================================================ */
async function startForge() {
  const topic = $("topic").value.trim();
  if (!topic) { alert("请填写学习方向"); return; }
  const id = uid();
  const body = {
    run_id: id, topic,
    goal: $("goal").value.trim() || null,
    layer_budget: +$("budget").value || 50,
    existing_names: $("existing").value.split("\n").map((s) => s.trim()).filter(Boolean),
  };
  const llmBase = $("llmBase").value.trim();
  const llmKey = $("llmKey").value.trim();
  const llmModel = $("llmModel").value.trim();
  const llmTemp = +$("llmTemp").value || 0.7;
  store.set("kgf_llm", { base_url: llmBase, api_key: llmKey, model: llmModel, temperature: llmTemp });  // 随锻造保存,下次自动带出
  if (llmKey) {
    body.llm = {
      base_url: llmBase || "https://api.deepseek.com",
      api_key: llmKey,
      model: llmModel || "deepseek-chat",
      temperature: llmTemp,
    };
  }
  try {
    const r = await api("POST", "/runs", body);
    state.run = { id: r.run_id || id, topic, status: "planning", startedAt: Date.now() };
    state.review = null; state.lastRaw = null; state.filterLayer = 0; state.filterTopic = "";
    histUpsert(state.run);
    renderStage();
    startPoll();
  } catch (e) { showError(e.message); }
}
function attachRun(id, topic) {
  stopPoll();
  state.run = { id, topic, status: "running", startedAt: Date.now() };
  state.review = null; state.lastRaw = null;
  renderStage();
  pollOnce(); startPoll();
}
function startPoll() {
  stopPoll();
  state.pollTimer = setInterval(pollOnce, 2000);
  state.clockTimer = setInterval(tickElapsed, 1000);
}
function stopPoll() {
  if (state.pollTimer) clearInterval(state.pollTimer);
  if (state.clockTimer) clearInterval(state.clockTimer);
  state.pollTimer = state.clockTimer = null;
}
async function pollOnce() {
  if (!state.run) return stopPoll();
  try {
    const v = await api("GET", "/runs/" + state.run.id);
    state.lastRaw = v;
    state.run.status = v.status;
    if (v.error) state.run.error = v.error;
    if (v.concepts || v.report) state.review = { concepts: v.concepts || [], report: v.report };
    if (v.coverage && state.review) state.review.report = v.coverage;
    if (v.status === "awaiting_review" || FINAL.has(v.status)) {
      if (FINAL.has(v.status)) state.run.endedAt = Date.now();
      stopPoll();
    }
    histUpsert(state.run);
    renderStage();
  } catch (e) {
    showError(e.message);
    if (e.status === 0 || e.status === 401) stopPoll();
  }
}
async function finalize(decision) {
  if (!state.run) return;
  try {
    const r = await api("POST", `/runs/${state.run.id}/finalize`, { decision, note: null });
    state.run.status = r.status || decision;
    state.run.endedAt = Date.now();
    stopPoll();
    histUpsert(state.run);
    renderStage();
  } catch (e) { showError(e.message); }
}
function showError(msg) {
  let box = document.querySelector(".stage-alert");
  if (!box) {
    box = document.createElement("div");
    box.className = "stage-alert";
    box.style.marginBottom = "0";
    $("stageView").prepend(box);
  }
  box.innerHTML = `<div class="alert">${esc(msg)}</div>`;
  setTimeout(() => { if (box) box.remove(); }, 8000);
}

/* ================================================================
   事件绑定与启动
   ================================================================ */
$("secret").value = state.secret;
const savedLlm = store.get("kgf_llm", {});
if (savedLlm.base_url) $("llmBase").value = savedLlm.base_url;
if (savedLlm.api_key) $("llmKey").value = savedLlm.api_key;
if (savedLlm.model) $("llmModel").value = savedLlm.model;
if (savedLlm.temperature != null) $("llmTemp").value = savedLlm.temperature;
$("secret").addEventListener("change", () => { state.secret = $("secret").value; store.set("kgf_secret", state.secret); });
$("testSecret").addEventListener("click", testSecret);
$("budgetRange").addEventListener("input", () => { $("budget").value = $("budgetRange").value; });
$("budget").addEventListener("change", () => { $("budgetRange").value = $("budget").value; });
$("startBtn").addEventListener("click", startForge);
$("hist").addEventListener("click", (ev) => {
  const del = ev.target.closest(".h-del");
  const li = ev.target.closest("li[data-i]");
  if (!li) return;
  const h = state.history[+li.dataset.i];
  if (!h) return;
  if (del) { histRemove(h.id); return; }
  attachRun(h.id, h.topic);
});
renderHistory();
renderStage();
renderConn();
checkConn();
setInterval(() => { if (state.demo) checkConn(); }, 10000);   // 演示模式下持续尝试回连
</script>
