[project]
name = "kg-forge"
version = "0.1.0"
description = "面霸 · 知识图谱锻造炉：LangGraph 离线批产概念树（Agent 只提案，写库权在 Java 后端）"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "langgraph>=0.2.60,<0.4",
    "langgraph-checkpoint-postgres>=2.0",
    "openai>=1.40",
    "pydantic>=2.7",
    "pydantic-settings>=2.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.5",
    "mypy>=1.10",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.ruff]
line-length = 110
target-version = "py312"
